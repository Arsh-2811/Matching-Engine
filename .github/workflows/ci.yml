name: C++ CI

on:
  push:
  pull_request:

jobs:
  # ── 1. Release build + correctness tests + format check ──────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/cpp-build
        with:
          build-type: Release
          extra-packages: clang clang-format

      - name: Run correctness tests
        run: ctest --test-dir build --output-on-failure --timeout 120 -E "Benchmark"

      - name: Check formatting
        run: git ls-files '*.cpp' '*.hpp' | xargs clang-format --dry-run --Werror

  # ── 2. Benchmarks (informational — failure does not block merge) ───────────
  benchmarks:
    runs-on: ubuntu-latest
    continue-on-error: true   # shared-runner jitter makes hard thresholds unreliable
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/cpp-build
        with:
          build-type: Release

      - name: Run benchmarks
        run: ctest --test-dir build --output-on-failure --timeout 120 -R "Benchmark"

  # ── 3. Sanitizers — correctness only, no performance assertions ───────────
  sanitizers:
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/cpp-build
        with:
          build-type: Debug
          extra-packages: clang
          cmake-flags: >-
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined"
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Run correctness tests (benchmarks excluded)
        run: ctest --test-dir build --output-on-failure --timeout 120 -E "Benchmark"

  # ── 4. clang-tidy static analysis ─────────────────────────────────────────
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/cpp-build
        with:
          build-type: Debug
          extra-packages: clang clang-tidy

      - name: Run clang-tidy
        run: ./scripts/run_clang_tidy.sh
